apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}
  namespace: {{ .Values.common.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}-role
  namespace: {{ .Values.common.namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}-binding
  namespace: {{ .Values.common.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}
  namespace: {{ .Values.common.namespace }}
roleRef:
  kind: Role
  name: {{ .Chart.Name }}-{{ .Values.serviceAccount.name }}-role
  apiGroup: rbac.authorization.k8s.io
