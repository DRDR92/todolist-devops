common:
  namespace: mysql

replicas: 2

image:
  repository: mysql
  tag: "8.0"

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_DATABASE: "app_db"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

pvc:
  storage: 2Gi

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1"

affinity: {}

tolerations: []
