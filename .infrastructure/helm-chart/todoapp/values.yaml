common:
  namespace: todoapp

image:
  repository: ikulyk404/todoapp
  tag: "4.0.1"

containerPort: 8080
nodePort: 30007

config:
  PYTHONUNBUFFERED: "1"

secrets:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

affinity:
  key: app
  values:
  - todoapp

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpu:
    averageUtilization: 70
  memory:
    averageUtilization: 70

pv:
  capacity: 1Gi
  hostPath: /data/

pvc:
  storage: 1Gi

serviceAccount:
  name: secrets-reader

mysql:
  common:
    namespace: mysql
  replicas: 2
  image:
    repository: mysql
    tag: "8.0"
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_DATABASE: "app_db"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"
  pvc:
    storage: 2Gi
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: app
            operator: In
            values:
            - mysql
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - mysql
        topologyKey: kubernetes.io/hostname
  tolerations:
  - key: app
    operator: Equal
    value: mysql
    effect: NoSchedule
